name: Prune published media

# Deletes batch folders older than PRUNE_AFTER_DAYS. The scheduler (Buffer)
# and the platforms fetch each file at publish time and keep their own
# copy, so source files are only needed until every post in the batch has
# gone out. A batch covers at most ~10 days from queueing; 21 days of grace
# is conservative. Folders not named YYYY-MM-DD are never touched.

on:
  schedule:
    - cron: "0 9 * * 0" # Sundays, 09:00 UTC
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prune old batch folders
        run: |
          python3 - <<'EOF'
          import os, shutil
          from datetime import date, timedelta

          PRUNE_AFTER_DAYS = 21
          cutoff = date.today() - timedelta(days=PRUNE_AFTER_DAYS)
          root = "batches"
          pruned = []
          if os.path.isdir(root):
              for name in sorted(os.listdir(root)):
                  p = os.path.join(root, name)
                  if not os.path.isdir(p):
                      continue
                  try:
                      d = date.fromisoformat(name)
                  except ValueError:
                      print(f"skip non-date folder: {name}")
                      continue
                  if d < cutoff:
                      shutil.rmtree(p)
                      pruned.append(name)
          print("pruned:", pruned if pruned else "(nothing old enough)")
          EOF
      - name: Commit pruning
        run: |
          git config user.name "church-social-media"
          git config user.email "church-social-media@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "prune media batches older than 21 days"
            git push
          fi
